[project]
name = "prooflab-api"
version = "0.1.0"
description = "FastAPI and SymPy backend for ProofLab"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=23,<26",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "SQLAlchemy>=2,<3",
  "sympy>=1.13,<2",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
